
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="container nav-wrap">

    <a class="brand" href="{{ .Site.Home.RelPermalink }}">
      <img
        class="brand-logo"
        src="{{ "logo.png" | relURL }}"
        alt="Chepkungurwet Foundation logo"
      >
      <span>
        CHEPKUNGURWET
        <small>FOUNDATION</small>
      </span>
    </a>

    <button
      class="menu-toggle"
      aria-label="Toggle navigation"
      aria-expanded="false"
    >
      ☰
    </button>

    <nav class="main-nav" aria-label="Main navigation">
      {{ $current := .RelPermalink }}

      {{ range site.Menus.main }}
        <a
          href="{{ .URL | relURL }}"
          class="{{ if eq $current (.URL | relURL) }}active{{ end }}"
        >
          {{ .Name }}
        </a>
      {{ end }}

     <a class="nav-donate" href="https://paystack.shop/pay/4uvst0zr1o">
  Donate
</a>
      
    </nav>

  </div>
</header>
