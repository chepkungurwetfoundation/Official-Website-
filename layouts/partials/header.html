<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand" href="{{ "/" | relURL }}"><img class="brand-logo" src="{{ "logo.png" | relURL }}" alt="Chepkungurwet Foundation logo"><span>CHEPKUNGURWET<small>FOUNDATION</small></span></a>
    <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
    <nav class="main-nav" aria-label="Main navigation">
      {{ $current := .RelPermalink }}
      {{ range .Site.Menus.main }}<a href="{{ .URL | relURL }}" class="{{ if eq $current (.URL | relURL) }}active{{ end }}">{{ .Name }}</a>{{ end }}
      <a class="nav-donate" href="{{ "donate/" | relURL }}">Donate</a>
    </nav>
  </div>
</header>
